name: Upload files to up.sb

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct HTTP(S) URL of the file to upload"
        required: true
        type: string
      filename:
        description: "Optional output filename"
        required: false
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download source file
        env:
          FILE_URL: ${{ inputs.file_url }}
          OUTPUT_NAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          if [[ ! "$FILE_URL" =~ ^https?:// ]]; then
            echo "::error::file_url must be an HTTP(S) URL"
            exit 1
          fi
          name="$OUTPUT_NAME"
          if [[ -z "$name" ]]; then
            name="$(basename "${FILE_URL%%\?*}")"
          fi
          if [[ -z "$name" || "$name" == "." || "$name" == "/" ]]; then
            name="upload.bin"
          fi
          curl --fail --location --retry 3 --retry-delay 2 "$FILE_URL" --output "$name"
          echo "UPLOAD_FILE=$name" >> "$GITHUB_ENV"
          ls -lh "$name"

      - name: Upload file to up.sb
        run: |
          set -euo pipefail
          echo "Uploading $UPLOAD_FILE to up.sb..."
          response="$(curl --fail-with-body --show-error --silent --retry 2 --upload-file "$UPLOAD_FILE" https://up.sb)"
          echo "up.sb response:"
          printf '%s\n' "$response"
          {
            echo "## up.sb upload result"
            echo
            echo '```text'
            printf '%s\n' "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
